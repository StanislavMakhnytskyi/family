<!-- NOTES -->
<text class="b" x="20" y="1830">Примітки</text>
<text class="note" x="20" y="1852">1. ID: автослаг (транслітерація імені та прізвища), перестає оновлюватись після ручного редагування. Перейменування ID каскадно оновлює зв'язки, поховання та медіа.</text>
<text class="note" x="20" y="1870">2. Три колонки на sm (640px) і вище; на мобільному одна.   3. Дати: показ дд.мм.рррр або лише рік, у файлі зберігається ISO/рік; поруч кнопка календаря «Обрати дату».</text>
<text class="note" x="20" y="1888">4. «Приховати з дерева»: дані зберігаються, сторінка людини відкривається напряму та через родичів.   5. Біографія: абзаци через порожній рядок.</text>
<text class="note" x="20" y="1906">6. Фото: аватар (коли є), кнопка вибору, попередній перегляд вибраного, «Прибрати фото».   7. Помилки сервера: role="alert", вимкнена кнопка зі спінером під час збереження.</text>
<text class="note" x="20" y="1924">8. Mobile: усі поля в один стовпець (три поля імені і дві дати йдуть одне під одним).   Усі форми повертаються на список із flash «Збережено.».</text>
</svg>
