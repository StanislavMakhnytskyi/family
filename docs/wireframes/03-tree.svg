<text class="muted sm" x="1528" y="217">Знайти людину</text>
<use href="#zoom" transform="translate(1834,702)"/>
<rect class="box" x="1512" y="700" width="300" height="54" rx="8"/>
<text class="note" x="1524" y="722">перетягніть · колесо /</text>
<text class="note" x="1524" y="740">щипок для масштабу</text>
