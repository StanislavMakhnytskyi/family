  <path class="line" d="M750 264 V360 M498 360 H918 M498 360 V400 M918 360 V400"/>
  <path class="line" d="M576 454 H604"/>
  <path class="line" d="M590 454 V550 M488 550 H672 M488 550 V590 M672 550 V590"/>
  <path class="dash" d="M1098 590 V572 H1282 V590"/>
  <!-- gen 1 -->
