  <circle class="avatar" cx="658" cy="244" r="21"/>
  <text class="b sm c" x="658" y="288">Василь Коваль</text><text class="muted c" x="658" y="306">1910 – 1985</text>
  <rect class="card" x="764" y="210" width="156" height="108" rx="8"/>
  <circle class="avatar" cx="842" cy="244" r="21"/>
  <text class="b sm c" x="842" y="288">Ганна Коваль</text><text class="muted c" x="842" y="306">1914 – 1999</text>
