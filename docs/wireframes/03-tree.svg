<!-- VARIANTS -->
<text class="b" x="20" y="900">Стани</text>
<text class="note" x="20" y="918">Пошук без збігів</text>
<rect class="frame" x="20" y="926" width="360" height="170"/>
<rect class="input" x="44" y="946" width="312" height="44" rx="8"/>
<text class="sm" x="60" y="973">Щщщ</text>
<rect class="box" x="44" y="996" width="312" height="44" rx="8"/>
<text class="muted sm" x="60" y="1023">Нікого не знайдено</text>

<text class="note" x="420" y="918">Порожнє дерево</text>
<rect class="frame" x="420" y="926" width="560" height="170"/>
<rect class="box" x="420" y="926" width="560" height="40"/>
<rect class="avatar" x="436" y="934" width="24" height="24" rx="6"/>
<text class="serif b" x="470" y="952">Родинна історія</text>
<rect class="btn" x="880" y="932" width="84" height="28" rx="8"/><text class="note c" x="922" y="950">Вийти</text>
<text class="title c" x="700" y="1038">Дерево поки порожнє</text>

<!-- LEGEND -->
<text class="b" x="20" y="1130">Примітки</text>
<text class="note" x="20" y="1152">1. Виділена картка: акцентне кільце та aria-current="true" (відкрита зі сторінки людини через «Знайти на дереві»).</text>
<text class="note" x="20" y="1170">2. Пунктирна дужка над двома картками: брати/сестри без записаних батьків. Суцільна шина: батьки та діти; коротка лінія: подружжя.</text>
<text class="note" x="20" y="1188">3. Пошук: до 6 результатів; Enter або клік центрує дерево на людині; без збігів показує «Нікого не знайдено».</text>
<text class="note" x="20" y="1206">4. Стек масштабу: три кнопки 44px (+, −, вмістити).   5. Підказка закривається ×; легенда під нею залишається.</text>
<text class="note" x="20" y="1224">6. Mobile: ширина пошуку min(20rem, 100% − 1.5rem).   7. Підказка вужча, щоб не перекривати стек масштабу (переноситься на 2 рядки).</text>
<text class="note" x="20" y="1242">8. Mobile: початкове «вмістити» не менше 0.5x і починається з верхнього покоління; решту дерева видно перетягуванням.</text>
</svg>
