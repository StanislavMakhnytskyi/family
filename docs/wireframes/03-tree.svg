  <rect class="card" x="420" y="400" width="156" height="108" rx="8"/>
  <circle class="avatar" cx="498" cy="434" r="21"/>
  <text class="b sm c" x="498" y="478">Петро Коваль</text><text class="muted c" x="498" y="496">1938 – 2011</text>
  <rect class="card" x="604" y="400" width="156" height="108" rx="8"/>
  <circle class="avatar" cx="682" cy="434" r="21"/>
  <text class="b sm c" x="682" y="478">Марія Коваль</text><text class="muted c" x="682" y="496">1941 – 2015</text>
  <rect class="card" x="840" y="400" width="156" height="108" rx="8"/>
  <circle class="avatar" cx="918" cy="434" r="21"/>
  <text class="b sm c" x="918" y="478">Ольга Мельник</text><text class="muted c" x="918" y="496">1945</text>
  <!-- gen 3 -->
