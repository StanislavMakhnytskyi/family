  <circle class="avatar" cx="488" cy="624" r="21"/>
  <text class="b sm c" x="488" y="668">Андрій Коваль</text><text class="muted c" x="488" y="686">1966</text>
  <rect class="ring" x="405" y="585" width="166" height="118" rx="11"/>
  <rect class="card" x="594" y="590" width="156" height="108" rx="8"/>
  <circle class="avatar" cx="672" cy="624" r="21"/>
  <text class="b sm c" x="672" y="668">Ірина Коваль</text><text class="muted c" x="672" y="686">1969</text>
  <rect class="card" x="1020" y="590" width="156" height="108" rx="8"/>
  <circle class="avatar" cx="1098" cy="624" r="21"/>
  <text class="b sm c" x="1098" y="668">Степан Бойко</text><text class="muted c" x="1098" y="686">1950</text>
  <rect class="card" x="1204" y="590" width="156" height="108" rx="8"/>
  <circle class="avatar" cx="1282" cy="624" r="21"/>
  <text class="b sm c" x="1282" y="668">Надія Бойко</text><text class="muted c" x="1282" y="686">1953</text>
 </g>
 <g id="legend">
  <rect class="box" x="0" y="0" width="250" height="84" rx="8"/>
  <path class="line" d="M14 16 H44 M29 8 V16 M14 16 V24 M44 16 V24"/>
  <text class="note" x="58" y="20">батьки та діти</text>
  <rect class="card" x="14" y="36" width="12" height="12" rx="2"/><rect class="card" x="34" y="36" width="12" height="12" rx="2"/>
  <path class="line" d="M26 42 H34"/>
  <text class="note" x="58" y="46">подружжя</text>
  <path class="dash" d="M14 72 V64 H44 V72"/>
  <text class="note" x="58" y="70">брати/сестри</text>
 </g>
 <g id="zoom">
  <rect class="btn" x="0" y="0" width="44" height="44" rx="8"/><text class="lg c b" x="22" y="29">+</text>
  <rect class="btn" x="0" y="52" width="44" height="44" rx="8"/><text class="lg c b" x="22" y="81">−</text>
  <rect class="btn" x="0" y="104" width="44" height="44" rx="8"/>
  <path class="line" d="M14 120 V114 H20 M30 114 H36 V120 M36 132 V138 H30 M20 138 H14 V132"/>
