</defs>
<rect class="bg" width="1930" height="1300"/>

<text class="title" x="20" y="36">Дерево родини</text>
<text class="note" x="20" y="58">Маршрут: /   ·   Бачать: члени родини (cookie family-session). Без сесії proxy веде на /gate.</text>

<!-- DESKTOP -->
<text class="b" x="20" y="100">Desktop 1440</text>
<rect class="frame" x="20" y="110" width="1440" height="760"/>
<g transform="translate(0,0)">
 <rect class="box" x="20" y="110" width="1440" height="64"/>
 <rect class="avatar" x="44" y="128" width="28" height="28" rx="6"/>
 <text class="serif lg b" x="84" y="148">Родинна історія</text>
 <rect class="btn" x="1350" y="124" width="90" height="36" rx="8"/>
 <text class="sm c" x="1395" y="147">Вийти</text>
 <text class="muted" x="760" y="147">sticky, 64px</text>
</g>
<use href="#tree" transform="translate(0,0)"/>

<!-- search -->
<rect class="input" x="44" y="190" width="320" height="44" rx="8"/>
<text class="muted sm" x="60" y="217">Знайти людину</text>
<rect class="box" x="44" y="240" width="320" height="240" rx="8"/>
<rect x="45" y="241" width="318" height="38" fill="#f1e6de"/>
<path d="M44 280 H364 M44 320 H364 M44 360 H364 M44 400 H364 M44 440 H364" stroke="#e3e3df" stroke-width="1"/>
<text class="sm" x="60" y="265">Петро Коваль</text><text class="muted e" x="348" y="265">1938 – 2011</text>
<text class="sm" x="60" y="305">Марія Коваль</text><text class="muted e" x="348" y="305">1941 – 2015</text>
<text class="sm" x="60" y="345">Андрій Коваль</text><text class="muted e" x="348" y="345">1966</text>
<text class="sm" x="60" y="385">Ірина Коваль</text><text class="muted e" x="348" y="385">1969</text>
<text class="sm" x="60" y="425">Василь Коваль</text><text class="muted e" x="348" y="425">1910 – 1985</text>
<text class="sm" x="60" y="465">Ганна Коваль</text><text class="muted e" x="348" y="465">1914 – 1999</text>

<!-- zoom, hint, legend (desktop) -->
<use href="#zoom" transform="translate(1396,702)"/>
<rect class="box" x="44" y="716" width="340" height="38" rx="8"/>
<text class="note" x="58" y="739">перетягніть · колесо / щипок для масштабу</text>
<rect class="btn" x="356" y="722" width="22" height="26" rx="6"/><text class="c" x="367" y="740">×</text>
<use href="#legend" transform="translate(44,762)"/>

<!-- callouts desktop -->
<use href="#callout" x="400" y="600"/><text class="note w b c" x="400" y="604">1</text>
<use href="#callout" x="1190" y="572"/><text class="note w b c" x="1190" y="576">2</text>
<use href="#callout" x="376" y="196"/><text class="note w b c" x="376" y="200">3</text>
<use href="#callout" x="1384" y="710"/><text class="note w b c" x="1384" y="714">4</text>
<use href="#callout" x="396" y="720"/><text class="note w b c" x="396" y="724">5</text>

<!-- MOBILE -->
<text class="b" x="1500" y="100">Mobile 390</text>
<rect class="frame" x="1500" y="110" width="390" height="760"/>
<g clip-path="url(#mclip)">
 <use href="#tree" transform="translate(1320,145) scale(0.5)"/>
</g>
<rect class="box" x="1500" y="110" width="390" height="64"/>
<rect class="avatar" x="1516" y="128" width="28" height="28" rx="6"/>
<text class="serif lg b" x="1556" y="148">Родинна історія</text>
<rect class="btn" x="1800" y="124" width="76" height="36" rx="8"/>
<text class="sm c" x="1838" y="147">Вийти</text>
