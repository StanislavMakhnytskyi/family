<text class="b" x="20" y="1580">Примітки</text>
<text class="note" x="20" y="1602">1. «Відкрити родовід» веде на / з виділеною карткою; для людей, прихованих із дерева, кнопка не показується.</text>
<text class="note" x="20" y="1620">2. Desktop: сітка 1fr | 340px (від 1024px). Ліворуч Біографія, Фотогалерея; праворуч Місце поховання, Родина.</text>
<text class="note" x="20" y="1638">3. Mobile: одна колонка, порядок: Біографія, Місце поховання, Родина, Фотогалерея (мініатюри в 2 колонки).</text>
<text class="note" x="20" y="1656">Секції родини: Батьки, Подружжя, Брати/сестри, Діти; картка родича: аватар 40px, ім'я, роки. Порожня секція не показується.</text>
<text class="note" x="20" y="1674">Місце поховання: адреса, опис і головне посилання «Відкрити в Google Картах» (відкривається в новій вкладці).</text>
<text class="note" x="20" y="1692">Дані відсутні: аватар → ініціали; немає дат → роки не показуються; немає полів → блок прихований без помилки.</text>
