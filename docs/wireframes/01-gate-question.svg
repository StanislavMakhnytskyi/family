<rect class="bg" width="1520" height="1320"/>
<text class="title" x="20" y="36">Шлюз, етап 1: запитання</text>
<text class="note" x="20" y="58">Маршрут: /gate   ·   Бачать: ще не авторизовані відвідувачі (шлюз)</text>
<text class="b" x="20" y="100">Desktop: початковий стан</text><rect class="frame" x="20" y="110" width="480" height="470"/><rect class="card" x="40" y="146" width="440" height="432" rx="12"/><rect class="avatar" x="243" y="174" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="260" y="242">Родинна історія</text><text class="muted sm c" x="260" y="270">Щоб продовжити, дайте відповідь на запитання</text><path d="M72 290 H448" stroke="#bdbdb8" stroke-width="1"/><text class="serif" style="font-size:21px" x="72" y="324">Як звали прабабусю</text><text class="serif" style="font-size:21px" x="72" y="352">по батьковій лінії?</text><rect class="input" x="72" y="372" width="376" height="48" rx="8"/><text class="muted sm" x="86" y="401">Ваша відповідь</text><rect class="btn-primary" x="72" y="474" width="234" height="48" rx="8"/><text class="w b sm c" x="189" y="503">Увійти</text><rect class="btn" x="318" y="474" width="130" height="48" rx="8"/><text class=" b sm c" x="383" y="503">Інше питання</text><text class="muted c" x="260" y="552">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="520" y="100">Desktop: неправильна відповідь</text><rect class="frame" x="520" y="110" width="480" height="470"/><rect class="card" x="540" y="146" width="440" height="432" rx="12"/><rect class="avatar" x="743" y="174" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="760" y="242">Родинна історія</text><text class="muted sm c" x="760" y="270">Щоб продовжити, дайте відповідь на запитання</text><path d="M572 290 H948" stroke="#bdbdb8" stroke-width="1"/><text class="serif" style="font-size:21px" x="572" y="324">Як звали прабабусю</text><text class="serif" style="font-size:21px" x="572" y="352">по батьковій лінії?</text><rect class="input" x="572" y="372" width="376" height="48" rx="8" style="stroke:#9c6446"/><text class="sm" x="586" y="401">Марія</text><text class="note b accent-t" x="572" y="442">Неправильна відповідь. Залишилось спроб: 2</text><text class="muted" x="572" y="460">Підказка: (текст підказки до запитання)</text><rect class="btn-primary" x="572" y="474" width="234" height="48" rx="8"/><text class="w b sm c" x="689" y="503">Увійти</text><rect class="btn" x="818" y="474" width="130" height="48" rx="8"/><text class=" b sm c" x="883" y="503">Інше питання</text><text class="muted c" x="760" y="552">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="1020" y="100">Desktop: блокування</text><rect class="frame" x="1020" y="110" width="480" height="470"/><rect class="card" x="1040" y="146" width="440" height="432" rx="12"/><rect class="avatar" x="1243" y="174" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="1260" y="242">Родинна історія</text><text class="muted sm c" x="1260" y="270">Щоб продовжити, дайте відповідь на запитання</text><path d="M1072 290 H1448" stroke="#bdbdb8" stroke-width="1"/><text class="serif" style="font-size:21px" x="1072" y="324">Як звали прабабусю</text><text class="serif" style="font-size:21px" x="1072" y="352">по батьковій лінії?</text><rect class="btn-disabled" x="1072" y="372" width="376" height="48" rx="8"/><text class="note b accent-t" x="1072" y="442">Спробуйте через 04:32</text><rect class="btn-disabled" x="1072" y="474" width="234" height="48" rx="8"/><text class="muted b sm c" x="1189" y="503">Увійти</text><rect class="btn-disabled" x="1318" y="474" width="130" height="48" rx="8"/><text class="muted b sm c" x="1383" y="503">Інше питання</text><text class="muted c" x="1260" y="552">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="20" y="660">Desktop: відправлення</text><rect class="frame" x="20" y="670" width="480" height="470"/><rect class="card" x="40" y="706" width="440" height="432" rx="12"/><rect class="avatar" x="243" y="734" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="260" y="802">Родинна історія</text><text class="muted sm c" x="260" y="830">Щоб продовжити, дайте відповідь на запитання</text><path d="M72 850 H448" stroke="#bdbdb8" stroke-width="1"/><text class="serif" style="font-size:21px" x="72" y="884">Як звали прабабусю</text><text class="serif" style="font-size:21px" x="72" y="912">по батьковій лінії?</text><rect class="input" x="72" y="932" width="376" height="48" rx="8"/><text class="muted sm" x="86" y="961">Ваша відповідь</text><rect class="btn-disabled" x="72" y="1034" width="234" height="48" rx="8"/><text class="muted b sm c" x="189" y="1063">Зачекайте…</text><rect class="btn-disabled" x="318" y="1034" width="130" height="48" rx="8"/><text class="muted b sm c" x="383" y="1063">Інше питання</text><text class="muted c" x="260" y="1112">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="520" y="660">Mobile 390: початковий стан</text><rect class="frame" x="520" y="670" width="390" height="520"/><rect class="card" x="532" y="706" width="366" height="490" rx="12"/><rect class="avatar" x="698" y="734" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="715" y="802">Родинна історія</text><text class="muted sm c" x="715" y="830">Щоб продовжити, дайте відповідь на запитання</text><path d="M564 850 H866" stroke="#bdbdb8" stroke-width="1"/><text class="serif" style="font-size:21px" x="564" y="884">Як звали прабабусю</text><text class="serif" style="font-size:21px" x="564" y="912">по батьковій лінії?</text><rect class="input" x="564" y="932" width="302" height="48" rx="8"/><text class="muted sm" x="578" y="961">Ваша відповідь</text><rect class="btn-primary" x="564" y="1034" width="302" height="48" rx="8"/><text class="w b sm c" x="715" y="1063">Увійти</text><rect class="btn" x="564" y="1092" width="302" height="48" rx="8"/><text class=" b sm c" x="715" y="1121">Інше питання</text><text class="muted c" x="715" y="1170">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="1020" y="660">Desktop: demo-режим</text><rect class="frame" x="1020" y="670" width="480" height="470"/><rect class="box" x="1020" y="670" width="480" height="30" style="stroke:#9c6446"/><text class="note c b" x="1260" y="690">Demo mode: any input is accepted (empty too)</text><rect class="card" x="1040" y="722" width="440" height="432" rx="12"/><rect class="avatar" x="1243" y="750" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="1260" y="818">Родинна історія</text><text class="muted sm c" x="1260" y="846">Щоб продовжити, дайте відповідь на запитання</text><path d="M1072 866 H1448" stroke="#bdbdb8" stroke-width="1"/><text class="serif" style="font-size:21px" x="1072" y="900">Як звали прабабусю</text><text class="serif" style="font-size:21px" x="1072" y="928">по батьковій лінії?</text><rect class="input" x="1072" y="948" width="376" height="48" rx="8"/><text class="muted sm" x="1086" y="977">Ваша відповідь</text><rect class="btn-primary" x="1072" y="1050" width="234" height="48" rx="8"/><text class="w b sm c" x="1189" y="1079">Увійти</text><rect class="btn" x="1318" y="1050" width="130" height="48" rx="8"/><text class=" b sm c" x="1383" y="1079">Інше питання</text><text class="muted c" x="1260" y="1128">Сімейний архів. Реєстрація не потрібна.</text><text class="b" x="20" y="1230">Примітки</text><text class="note" x="20" y="1252">Картка шириною до 440px по центру; на mobile займає ширину екрана мінус поля, а «Інше питання» стає на всю ширину під «Увійти».</text><text class="note" x="20" y="1270">Спроби: після помилки показується кількість спроб, що залишилися, і підказка до запитання. Блокування: зворотний відлік 04:32, поле й кнопки вимкнені.</text><text class="note" x="20" y="1288">«Інше питання» показує інше випадкове запитання. Під час відправлення кнопка показує «Зачекайте…» і не реагує.</text><text class="note" x="20" y="1306">Demo mode: смуга зверху, інтерфейс англійською, шлюз приймає будь-який ввід. Лічильник етапу 1 не залежить від етапу 2.</text>
</svg>
