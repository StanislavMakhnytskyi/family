<svg xmlns="http://www.w3.org/2000/svg" width="1930" height="1960" viewBox="0 0 1930 1960" role="img" aria-labelledby="t d">
<title id="t">Адмін: вхід і вибір джерела даних</title>
<desc id="d">Каркас екрана входу в адміністрування /admin/login зі станами та екрана вибору джерела даних /admin, desktop 1440 і mobile 390.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#2b2b2b}
.bg{fill:#f2f2f0}
.frame{fill:#f2f2f0;stroke:#bdbdb8;stroke-width:1.5}
.box{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.card{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.btn{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.btn-primary{fill:#9c6446;stroke:#9c6446;stroke-width:1.5}
.btn-disabled{fill:#e6e6e3;stroke:#d0d0cc;stroke-width:1.5}
.input{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.avatar{fill:#d9d9d5;stroke:#bdbdb8;stroke-width:1.5}
.ink{fill:#222}
.line{stroke:#2b2b2b;stroke-width:2;fill:none}
.dash{stroke:#777;stroke-width:2;stroke-dasharray:6 5;fill:none}
.ring{fill:none;stroke:#9c6446;stroke-width:3}
.call{fill:#9c6446}
.accent{fill:#9c6446}
.accent-t{fill:#9c6446}
.muted{fill:#777;font-size:12px}
.title{font-family:Georgia,serif;font-size:22px;font-weight:bold}
.serif{font-family:Georgia,serif}
.note{font-size:12px;fill:#2b2b2b}
.b{font-weight:bold}
.w{fill:#fff}
.c{text-anchor:middle}
.e{text-anchor:end}
.sm{font-size:13px}
.lg{font-size:16px}
</style>
<defs>
 <g id="callout"><circle class="call" r="10"/></g>
 <!-- login card top part, origin = card top-left, card width 380 -->
 <g id="lhead">
  <rect class="avatar" x="173" y="34" width="34" height="34" rx="8"/>
  <text class="title c" x="190" y="104">Адміністрування</text>
  <text class="muted c" x="190" y="128">Увійдіть, щоб редагувати дані архіву</text>
  <path d="M0 150 H380" stroke="#e3e3df" stroke-width="1"/>
 </g>
 <!-- source cards, origin = card top-left, width 294 -->
 <g id="srcLocal">
  <text class="serif lg b" x="20" y="36">Локальні файли</text>
  <text class="note" x="20" y="62">src/data/*.json на диску. Працює лише</text>
  <text class="note" x="20" y="78">в локальній розробці.</text>
 </g>
 <g id="srcGlobal">
  <text class="serif lg b" x="20" y="36">Vercel Global Config</text>
  <text class="note" x="20" y="62">Живі дані сайту. Зміни поширюються на</text>
  <text class="note" x="20" y="78">прод протягом ~10 секунд.</text>
 </g>
</defs>
<rect class="bg" width="1930" height="1960"/>

<text class="title" x="20" y="36">Адмін: вхід і вибір джерела даних</text>
<text class="note" x="20" y="58">Маршрути: /admin/login, /admin   ·   Бачать: адміністратор (окремий cookie admin-session, окремі облікові дані та окреме блокування). У demo-режимі /admin/* повертає 404.</text>

<!-- ============ LOGIN ============ -->
<text class="b" x="20" y="100">Вхід, /admin/login: desktop 1440</text>
<rect class="frame" x="20" y="110" width="1440" height="400"/>
<rect class="card" x="550" y="130" width="380" height="360" rx="12"/>
<use href="#lhead" transform="translate(550,130)"/>
<rect class="input" x="578" y="302" width="324" height="44" rx="8"/><text class="muted sm" x="594" y="329">Логін</text>
<rect class="input" x="578" y="356" width="324" height="44" rx="8"/><text class="muted sm" x="594" y="383">Пароль</text>
<rect class="btn-primary" x="578" y="418" width="324" height="44" rx="8"/><text class="w b c sm" x="740" y="445">Увійти</text>
<text class="muted" x="970" y="150">картка max 380px, по центру екрана</text>
<use href="#callout" x="550" y="130"/><text class="note w b c" x="550" y="134">1</text>

<text class="b" x="1500" y="100">Mobile 390</text>
<rect class="frame" x="1500" y="110" width="390" height="400"/>
<rect class="card" x="1518" y="130" width="354" height="360" rx="12"/>
<rect class="avatar" x="1678" y="164" width="34" height="34" rx="8"/>
<text class="title c" x="1695" y="234">Адміністрування</text>
<text class="muted c" x="1695" y="258">Увійдіть, щоб редагувати дані архіву</text>
<path d="M1518 280 H1872" stroke="#e3e3df" stroke-width="1"/>
<rect class="input" x="1546" y="302" width="298" height="44" rx="8"/><text class="muted sm" x="1562" y="329">Логін</text>
<rect class="input" x="1546" y="356" width="298" height="44" rx="8"/><text class="muted sm" x="1562" y="383">Пароль</text>
<rect class="btn-primary" x="1546" y="418" width="298" height="44" rx="8"/><text class="w b c sm" x="1695" y="445">Увійти</text>

<!-- login states -->
<text class="b" x="20" y="535">Стани форми входу</text>
<!-- invalid -->
<text class="note" x="20" y="555">Невірні дані</text>
<rect class="frame" x="20" y="562" width="440" height="440"/>
<rect class="card" x="50" y="587" width="380" height="374" rx="12"/>
<use href="#lhead" transform="translate(50,587)"/>
<rect class="input" x="78" y="759" width="324" height="44" rx="8"/><text class="muted sm" x="94" y="786">Логін</text>
<rect class="input" x="78" y="813" width="324" height="44" rx="8"/><text class="muted sm" x="94" y="840">Пароль</text>
<text style="fill:#9c4a3a;font-size:13px" x="80" y="877">Невірний логін або пароль. Залишилось спроб: 2</text>
<rect class="btn-primary" x="78" y="889" width="324" height="44" rx="8"/><text class="w b c sm" x="240" y="916">Увійти</text>
<use href="#callout" x="446" y="872"/><text class="note w b c" x="446" y="876">2</text>
<!-- locked -->
<text class="note" x="480" y="555">Заблоковано (3 невдалі спроби, 15 хв)</text>
<rect class="frame" x="480" y="562" width="440" height="440"/>
<rect class="card" x="510" y="587" width="380" height="408" rx="12"/>
<use href="#lhead" transform="translate(510,587)"/>
<rect class="btn-disabled" x="538" y="759" width="324" height="44" rx="8"/><text class="muted sm" x="554" y="786">Логін</text>
<rect class="btn-disabled" x="538" y="813" width="324" height="44" rx="8"/><text class="muted sm" x="554" y="840">Пароль</text>
<rect x="538" y="867" width="324" height="42" rx="8" fill="#f1e6de" stroke="#bdbdb8" stroke-width="1.5"/>
<circle class="accent" cx="558" cy="888" r="4"/>
<text class="sm" x="572" y="893">Спробуйте через <tspan class="b">14:32</tspan></text>
<rect class="btn-disabled" x="538" y="923" width="324" height="44" rx="8"/><text class="muted c sm" x="700" y="950">Увійти</text>
<use href="#callout" x="906" y="888"/><text class="note w b c" x="906" y="892">3</text>
<!-- submitting -->
<text class="note" x="940" y="555">Відправлення</text>
<rect class="frame" x="940" y="562" width="440" height="440"/>
<rect class="card" x="970" y="587" width="380" height="360" rx="12"/>
<use href="#lhead" transform="translate(970,587)"/>
<rect class="input" x="998" y="759" width="324" height="44" rx="8"/><text class="sm" x="1014" y="786">admin</text>
<rect class="input" x="998" y="813" width="324" height="44" rx="8"/><text class="sm" x="1014" y="840">••••••••</text>
<rect class="btn-primary" x="998" y="875" width="324" height="44" rx="8"/>
<circle cx="1118" cy="897" r="7" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="26 18"/>
<text class="w b sm" x="1134" y="902">Зачекайте…</text>
<use href="#callout" x="1366" y="897"/><text class="note w b c" x="1366" y="901">4</text>

<!-- ============ SOURCE PICKER ============ -->
<text class="b" x="20" y="1042">Вибір джерела даних, /admin: desktop 1440</text>
<rect class="frame" x="20" y="1052" width="1440" height="400"/>
<!-- header: own, no tab nav -->
<rect class="avatar" x="438" y="1092" width="26" height="26" rx="6"/>
<text class="serif lg b" x="472" y="1111">Адміністрування</text>
<text class="sm e" x="1042" y="1111">Вийти</text>
<text class="title" x="438" y="1178">Джерело даних</text>
<text class="muted" x="438" y="1202" style="font-size:13px">Оберіть, які дані редагувати цього разу.</text>
<rect class="card" x="438" y="1224" width="294" height="168" rx="12"/>
<use href="#srcLocal" transform="translate(438,1224)"/>
<rect class="btn" x="458" y="1328" width="254" height="44" rx="8"/><text class="sm b c" x="585" y="1355">Обрати</text>
<rect class="card" x="748" y="1224" width="294" height="168" rx="12"/>
<use href="#srcGlobal" transform="translate(748,1224)"/>
<rect class="btn" x="768" y="1328" width="254" height="44" rx="8"/><text class="sm b c" x="895" y="1355">Обрати</text>
<text class="muted" x="1090" y="1111">max 640px, по центру</text>
<use href="#callout" x="424" y="1105"/><text class="note w b c" x="424" y="1109">5</text>
<use href="#callout" x="1056" y="1224"/><text class="note w b c" x="1056" y="1228">6</text>

<text class="b" x="1500" y="1042">Mobile 390</text>
<rect class="frame" x="1500" y="1052" width="390" height="610"/>
<rect class="avatar" x="1518" y="1092" width="26" height="26" rx="6"/>
<text class="serif lg b" x="1552" y="1111">Адміністрування</text>
<text class="sm e" x="1872" y="1111">Вийти</text>
<text class="title" x="1518" y="1178">Джерело даних</text>
<text class="muted" x="1518" y="1202" style="font-size:13px">Оберіть, які дані редагувати цього разу.</text>
<rect class="card" x="1518" y="1224" width="354" height="168" rx="12"/>
<use href="#srcLocal" transform="translate(1518,1224)"/>
<rect class="btn" x="1538" y="1328" width="314" height="44" rx="8"/><text class="sm b c" x="1695" y="1355">Обрати</text>
<rect class="card" x="1518" y="1408" width="354" height="168" rx="12"/>
<use href="#srcGlobal" transform="translate(1518,1408)"/>
<rect class="btn" x="1538" y="1512" width="314" height="44" rx="8"/><text class="sm b c" x="1695" y="1539">Обрати</text>
<text class="muted" x="1518" y="1610">один стовпець; 2 колонки з sm (640px)</text>

<!-- variants -->
<text class="b" x="20" y="1482">Одне з джерел недоступне</text>
<text class="note" x="20" y="1502">На Vercel: локальні файли недоступні</text>
<rect class="frame" x="20" y="1510" width="680" height="270"/>
<rect class="card" x="48" y="1535" width="294" height="220" rx="12"/>
<use href="#srcLocal" transform="translate(48,1535)"/>
<rect class="btn-disabled" x="68" y="1639" width="254" height="44" rx="8"/><text class="muted c sm" x="195" y="1666">Обрати</text>
<text style="fill:#9c4a3a;font-size:12px" x="68" y="1705">Недоступно на Vercel — файлова система</text>
<text style="fill:#9c4a3a;font-size:12px" x="68" y="1721">там лише для читання.</text>
<rect class="card" x="358" y="1535" width="294" height="220" rx="12"/>
<use href="#srcGlobal" transform="translate(358,1535)"/>
<rect class="btn" x="378" y="1691" width="254" height="44" rx="8"/><text class="sm b c" x="505" y="1718">Обрати</text>
<use href="#callout" x="44" y="1540"/><text class="note w b c" x="44" y="1544">7</text>

<text class="note" x="720" y="1502">Локально: не задано змінні Global Config</text>
<rect class="frame" x="720" y="1510" width="680" height="270"/>
<rect class="card" x="748" y="1535" width="294" height="220" rx="12"/>
<use href="#srcLocal" transform="translate(748,1535)"/>
<rect class="btn" x="768" y="1691" width="254" height="44" rx="8"/><text class="sm b c" x="895" y="1718">Обрати</text>
<rect class="card" x="1058" y="1535" width="294" height="220" rx="12"/>
<use href="#srcGlobal" transform="translate(1058,1535)"/>
<rect class="btn-disabled" x="1078" y="1639" width="254" height="44" rx="8"/><text class="muted c sm" x="1205" y="1666">Обрати</text>
<text style="fill:#9c4a3a;font-size:12px" x="1078" y="1705">Задайте GLOBAL_CONFIG, VERCEL_API_TOKEN,</text>
<text style="fill:#9c4a3a;font-size:12px" x="1078" y="1721">VERCEL_GLOBAL_CONFIG_STORE_ID.</text>

<!-- NOTES -->
<text class="b" x="20" y="1820">Примітки</text>
<text class="note" x="20" y="1842">1. Картка входу: max 380px, лого, заголовок «Адміністрування», підзаголовок, поля «Логін» і «Пароль» (placeholder), кнопка «Увійти» на всю ширину.</text>
<text class="note" x="20" y="1860">2. Невірні дані: червоний рядок role="alert" під полями; лічильник спроб, що залишились, з відповіді сервера.</text>
<text class="note" x="20" y="1878">3. Блокування: поля та кнопка вимкнені, повідомлення «Спробуйте через мм:сс», таймер оновлюється кожні 0,5 с. Лічильник і блокування окремі від родинного шлюзу.</text>
<text class="note" x="20" y="1896">4. Відправлення: кнопка вимкнена, спінер і «Зачекайте…», форма aria-busy.   5. Сторінка вибору джерела має власну шапку без вкладок (лише «Вийти»).</text>
<text class="note" x="20" y="1914">6. Дві картки в сітці з 2 колонок від sm (640px), на вужчих екранах одна під одною.   7. Недоступне джерело: вимкнена кнопка та червона пояснювальна примітка.</text>
<text class="note" x="20" y="1932">Червоний тут і далі: токен помилки застосунку (#9c4a3a). Решта каркаса: сірий і акцентний теракотовий.</text>
</svg>
