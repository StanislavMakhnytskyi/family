<text class="title" x="20" y="36">Шлюз, етап 2: роки народження</text>
<text class="note" x="20" y="58">Маршрут: /gate/years   ·   Бачать: ще не авторизовані відвідувачі (шлюз)</text>
<text class="b" x="20" y="100">Desktop: початковий стан</text><rect class="frame" x="20" y="110" width="480" height="510"/><rect class="card" x="40" y="146" width="440" height="430" rx="12"/><rect class="avatar" x="243" y="174" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="260" y="242">Родинна історія</text><text class="serif b c" style="font-size:20px" x="260" y="270">Ще одна перевірка</text><text class="muted sm c" x="260" y="294">Введіть роки народження трьох</text><text class="muted sm c" x="260" y="312">будь-яких членів родини</text><path d="M72 332 H448" stroke="#bdbdb8" stroke-width="1"/><rect class="input" x="72" y="366" width="117.33333333333333" height="52" rx="8"/><text class="muted c" x="130.66666666666666" y="397">РРРР</text><rect class="input" x="201.33333333333331" y="366" width="117.33333333333333" height="52" rx="8"/><text class="muted c" x="260" y="397">РРРР</text><rect class="input" x="330.66666666666663" y="366" width="117.33333333333333" height="52" rx="8"/><text class="muted c" x="389.3333333333333" y="397">РРРР</text><rect class="btn-primary" x="72" y="472" width="376" height="48" rx="8"/><text class="w b sm c" x="260" y="501">Увійти</text><text class="muted c" x="260" y="550">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="520" y="100">Desktop: неповна форма</text><rect class="frame" x="520" y="110" width="480" height="510"/><rect class="card" x="540" y="146" width="440" height="430" rx="12"/><rect class="avatar" x="743" y="174" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="760" y="242">Родинна історія</text><text class="serif b c" style="font-size:20px" x="760" y="270">Ще одна перевірка</text><text class="muted sm c" x="760" y="294">Введіть роки народження трьох</text><text class="muted sm c" x="760" y="312">будь-яких членів родини</text><path d="M572 332 H948" stroke="#bdbdb8" stroke-width="1"/><rect class="input" x="572" y="366" width="117.33333333333333" height="52" rx="8"/><text class="lg c" x="630.6666666666666" y="398">1938</text><rect class="input" x="701.3333333333333" y="366" width="117.33333333333333" height="52" rx="8"/><text class="lg c" x="759.9999999999999" y="398">1941</text><rect class="input" x="830.6666666666666" y="366" width="117.33333333333333" height="52" rx="8" style="stroke:#9c6446"/><text class="muted c" x="889.3333333333333" y="397">РРРР</text><text class="note b accent-t" x="572" y="440">Заповніть усі три поля</text><rect class="btn-primary" x="572" y="472" width="376" height="48" rx="8"/><text class="w b sm c" x="760" y="501">Увійти</text><text class="muted c" x="760" y="550">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="1020" y="100">Desktop: однакові роки</text><rect class="frame" x="1020" y="110" width="480" height="510"/><rect class="card" x="1040" y="146" width="440" height="430" rx="12"/><rect class="avatar" x="1243" y="174" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="1260" y="242">Родинна історія</text><text class="serif b c" style="font-size:20px" x="1260" y="270">Ще одна перевірка</text><text class="muted sm c" x="1260" y="294">Введіть роки народження трьох</text><text class="muted sm c" x="1260" y="312">будь-яких членів родини</text><path d="M1072 332 H1448" stroke="#bdbdb8" stroke-width="1"/><rect class="input" x="1072" y="366" width="117.33333333333333" height="52" rx="8" style="stroke:#9c6446"/><text class="lg c" x="1130.6666666666667" y="398">1938</text><rect class="input" x="1201.3333333333333" y="366" width="117.33333333333333" height="52" rx="8" style="stroke:#9c6446"/><text class="lg c" x="1260" y="398">1938</text><rect class="input" x="1330.6666666666665" y="366" width="117.33333333333333" height="52" rx="8"/><text class="lg c" x="1389.3333333333333" y="398">1941</text><text class="note b accent-t" x="1072" y="440">Роки мають бути різними</text><rect class="btn-disabled" x="1072" y="472" width="376" height="48" rx="8"/><text class="muted b sm c" x="1260" y="501">Увійти</text><text class="muted c" x="1260" y="550">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="20" y="680">Desktop: неправильні роки</text><rect class="frame" x="20" y="690" width="480" height="510"/><rect class="card" x="40" y="726" width="440" height="430" rx="12"/><rect class="avatar" x="243" y="754" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="260" y="822">Родинна історія</text><text class="serif b c" style="font-size:20px" x="260" y="850">Ще одна перевірка</text><text class="muted sm c" x="260" y="874">Введіть роки народження трьох</text><text class="muted sm c" x="260" y="892">будь-яких членів родини</text><path d="M72 912 H448" stroke="#bdbdb8" stroke-width="1"/><rect class="input" x="72" y="946" width="117.33333333333333" height="52" rx="8" style="stroke:#9c6446"/><text class="lg c" x="130.66666666666666" y="978">1938</text><rect class="input" x="201.33333333333331" y="946" width="117.33333333333333" height="52" rx="8" style="stroke:#9c6446"/><text class="lg c" x="260" y="978">1941</text><rect class="input" x="330.66666666666663" y="946" width="117.33333333333333" height="52" rx="8" style="stroke:#9c6446"/><text class="lg c" x="389.3333333333333" y="978">1975</text><text class="note b accent-t" x="72" y="1020">Не всі роки збігаються. Залишилось спроб: 2</text><rect class="btn-primary" x="72" y="1052" width="376" height="48" rx="8"/><text class="w b sm c" x="260" y="1081">Увійти</text><text class="muted c" x="260" y="1130">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="520" y="680">Desktop: блокування</text><rect class="frame" x="520" y="690" width="480" height="510"/><rect class="card" x="540" y="726" width="440" height="430" rx="12"/><rect class="avatar" x="743" y="754" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="760" y="822">Родинна історія</text><text class="serif b c" style="font-size:20px" x="760" y="850">Ще одна перевірка</text><text class="muted sm c" x="760" y="874">Введіть роки народження трьох</text><text class="muted sm c" x="760" y="892">будь-яких членів родини</text><path d="M572 912 H948" stroke="#bdbdb8" stroke-width="1"/><rect class="btn-disabled" x="572" y="946" width="117.33333333333333" height="52" rx="8"/><rect class="btn-disabled" x="701.3333333333333" y="946" width="117.33333333333333" height="52" rx="8"/><rect class="btn-disabled" x="830.6666666666666" y="946" width="117.33333333333333" height="52" rx="8"/><text class="note b accent-t" x="572" y="1020">Спробуйте через 04:32</text><rect class="btn-disabled" x="572" y="1052" width="376" height="48" rx="8"/><text class="muted b sm c" x="760" y="1081">Увійти</text><text class="muted c" x="760" y="1130">Сімейний архів. Реєстрація не потрібна.</text>
<text class="b" x="1020" y="680">Mobile 390: початковий стан</text><rect class="frame" x="1020" y="690" width="390" height="510"/><rect class="card" x="1032" y="726" width="366" height="430" rx="12"/><rect class="avatar" x="1198" y="754" width="34" height="34" rx="8"/><text class="serif b c" style="font-size:28px" x="1215" y="822">Родинна історія</text><text class="serif b c" style="font-size:20px" x="1215" y="850">Ще одна перевірка</text><text class="muted sm c" x="1215" y="874">Введіть роки народження трьох</text><text class="muted sm c" x="1215" y="892">будь-яких членів родини</text><path d="M1064 912 H1366" stroke="#bdbdb8" stroke-width="1"/><rect class="input" x="1064" y="946" width="92.66666666666667" height="52" rx="8"/><text class="muted c" x="1110.3333333333333" y="977">РРРР</text><rect class="input" x="1168.6666666666667" y="946" width="92.66666666666667" height="52" rx="8"/><text class="muted c" x="1215" y="977">РРРР</text><rect class="input" x="1273.3333333333333" y="946" width="92.66666666666667" height="52" rx="8"/><text class="muted c" x="1319.6666666666665" y="977">РРРР</text><rect class="btn-primary" x="1064" y="1052" width="302" height="48" rx="8"/><text class="w b sm c" x="1215" y="1081">Увійти</text><text class="muted c" x="1215" y="1130">Сімейний архів. Реєстрація не потрібна.</text><text class="b" x="20" y="1240">Примітки</text><text class="note" x="20" y="1262">Три поля по 4 цифри завжди в 3 колонки (на будь-якій ширині); після 4-ї цифри фокус сам переходить до наступного поля.</text><text class="note" x="20" y="1280">Підходять роки будь-яких трьох людей з дерева. Однакові роки: кнопка вимкнена, повідомлення «Роки мають бути різними».</text><text class="note" x="20" y="1298">Без cookie етапу 1 (family-gate-stage1) маршрут перенаправляє на /gate. Блокування етапу 2 не змінює лічильник етапу 1.</text><text class="note" x="20" y="1316">Успіх ставить family-session і веде на дерево (/).</text>
</svg>
