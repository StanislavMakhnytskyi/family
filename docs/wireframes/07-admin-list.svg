<svg xmlns="http://www.w3.org/2000/svg" width="1930" height="1300" viewBox="0 0 1930 1300" role="img" aria-labelledby="t d">
<title id="t">Адмін: оболонка та список людей</title>
<desc id="d">Каркас адмін-панелі: липка шапка, вкладки, список людей зі стани видалення, порожній стан і помилка читання, desktop 1440 і mobile 390. Стовпці інших списків окремою таблицею.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#2b2b2b}
.bg{fill:#f2f2f0}
.frame{fill:#f2f2f0;stroke:#bdbdb8;stroke-width:1.5}
.box{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.card{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.btn{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.btn-primary{fill:#9c6446;stroke:#9c6446;stroke-width:1.5}
.btn-disabled{fill:#e6e6e3;stroke:#d0d0cc;stroke-width:1.5}
.input{fill:#fff;stroke:#bdbdb8;stroke-width:1.5}
.avatar{fill:#d9d9d5;stroke:#bdbdb8;stroke-width:1.5}
.ink{fill:#222}
.line{stroke:#2b2b2b;stroke-width:2;fill:none}
.dash{stroke:#777;stroke-width:2;stroke-dasharray:6 5;fill:none}
.ring{fill:none;stroke:#9c6446;stroke-width:3}
.call{fill:#9c6446}
.accent{fill:#9c6446}
.accent-t{fill:#9c6446}
.muted{fill:#777;font-size:12px}
.title{font-family:Georgia,serif;font-size:22px;font-weight:bold}
.serif{font-family:Georgia,serif}
.note{font-size:12px;fill:#2b2b2b}
.b{font-weight:bold}
.w{fill:#fff}
.c{text-anchor:middle}
.e{text-anchor:end}
.sm{font-size:13px}
.lg{font-size:16px}
</style>
<defs>
 <g id="callout"><circle class="call" r="10"/></g>
 <clipPath id="mclip"><rect x="1520" y="290" width="350" height="290"/></clipPath>
</defs>
<rect class="bg" width="1930" height="1300"/>

<text class="title" x="20" y="36">Адмін: оболонка та список людей</text>
<text class="note" x="20" y="58">Маршрут: /admin/people (так само /admin/relationships, /graves, /media, /questions)   ·   Бачать: адміністратор (cookie admin-session) з обраним джерелом даних; без нього редирект на /admin.</text>

