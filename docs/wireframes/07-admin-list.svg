<text class="sm" x="40" y="1027">Люди</text><text class="sm" x="260" y="1027">/admin/people</text><text class="sm" x="560" y="1027">Люди</text><text class="sm" x="820" y="1027">Ім'я (+ тег «приховано з дерева»), Роки</text><text class="sm" x="1180" y="1027">Редагувати / Видалити</text>
<text class="sm" x="40" y="1063">Зв'язки</text><text class="sm" x="260" y="1063">/admin/relationships</text><text class="sm" x="560" y="1063">Зв'язки</text><text class="sm" x="820" y="1063">Тип, Особа 1, Особа 2</text><text class="sm" x="1180" y="1063">Редагувати / Видалити</text>
