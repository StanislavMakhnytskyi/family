<!-- NOTES -->
<text class="b" x="20" y="1204">Примітки</text>
<text class="note" x="20" y="1224">1. Липка шапка: логотип + «Адміністрування», рядок «Джерело: … · Змінити» (повертає на /admin) і «Вийти». Вміст обмежений 1000px (main теж).</text>
<text class="note" x="20" y="1240">2. Вкладки: Люди, Зв'язки, Поховання, Медіа, Питання; поточна має aria-current="page", жирний шрифт і тло (також на /new та /[id]).</text>
<text class="note" x="20" y="1256">3. Flash role="status": «Збережено.» або «Видалено.», зникає через 4 с (одноразовий cookie admin-flash).   4. Видалити, потім Підтвердити (суцільний червоний) + Скасувати.</text>
<text class="note" x="20" y="1272">5. Тег «приховано з дерева» для людей з hidden.   6. Mobile: вкладки прокручуються по горизонталі.   7. Mobile: таблиця в обгортці overflow-x-auto, колонка дій праворуч.   Червоне: токен помилки #9c4a3a.</text>
</svg>
